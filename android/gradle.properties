# Le `tmpdir` AF_UNIX est force sur un chemin sans espace. Sur cette machine, le
# profil « D ELL » (avec un espace) resout java.io.tmpdir en nom court 8.3
# (« C:\Users\DELL~1\... ») que le JDK 21 (WEPoll selector) n'arrive pas a
# utiliser pour son socket AF_UNIX interne : le demon Gradle meurt au demarrage
# sur « Unable to establish loopback connection ». Le meme reglage cote lanceur
# passe par GRADLE_OPTS.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=D:\\gtmp -Djdk.net.unixdomain.tmpdir=D:\\gtmp
android.useAndroidX=true

# Compilation incrementale Kotlin desactivee : sur Windows, la fermeture des
# caches `.tab` echoue de facon intermittente (verrouillage de fichier par
# l'antivirus ou le demon Kotlin) et fait echouer le build entier. Le cout est
# quelques dizaines de secondes par compilation propre ; le gain est un build
# reproductible, condition de la chaine de livraison du §16.3.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
